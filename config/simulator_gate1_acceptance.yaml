# GATE 1 판정 기준 — #208 실측 전에 고정한다. 결과를 본 뒤 바꾸지 않는다.
# 근거와 기각한 안: docs/decisions/DR-208-gate1-acceptance-criteria.md
# 띠 값의 정본은 여기가 아니다 — 가드레일은 config/simulator_config.yaml `guardrails`,
# F1~F17 은 docs/research/data_grounding.md §4 (= scripts/research/realism_check.py BANDS).
# 이 파일은 그 띠를 "몇 seed 로, 어느 출처 값으로, 어떤 규칙이면 통과인가" 만 정한다.
# 생성에 쓰지 않는다(시뮬레이터 다이제스트와 무관).
version: gate1-acceptance-v1
fixed_before_measurement: true
# ★ 처치 지표(eligible_spec41) 판정 모집단은 리드(인성) 확인 대기다. 확인되면 이 줄과 pending 키를 지운다.
pending: lead_confirmation_treatment_population

# 실측 인터프리터 — realism_check.py 가 numpy · pandas 를 쓰고, pyarrow 유무로 이벤트 저장 형식(parquet / gzip JSONL)이 바뀐다.
# 의존성 없는 3.12 에서는 실측하지 않는다. #209 ③ 재현도 같은 환경에서 한다.
environment: "python3.12 + pip install -r requirements.txt -r requirements-dev.txt"

sample:
  seeds: [47, 48, 49, 50, 51]          # 확인 seed (보정 seed 42~46 은 쓰지 않는다)
  customers: 13000                     # 정본 모집단 ② 약 5,200명 이상 (DR-194 가드레일 표본)
  # 가드레일 리포트 실측 조건 — 판정 스크립트가 리포트의 같은 값과 대조한다(어긋나면 입력 오류)
  guardrail_profile: small
  guardrail_warmup_days: 180
  guardrail_full_evaluation: true      # --sample 을 쓰지 않는다 (평가 고객 = 모집단 전원)

sources:
  guardrail_report:                    # 가드레일 판정 출처 — DR-194·196 보정과 같은 조건
    command: >-
      python3.12 -m src.simulator guardrails --seed {seed} --customers 13000
      --profile small --warmup-days 180 --output-root {new_dir}
  realism:                             # F1~F11 · F13 · F17 출처
    commands:
      - >-
        PYTHONPATH=. python3.12 scripts/research/run_world.py --seed {seed} --customers 13000
        --out {new_dir} --profile reference --days 315 --assign-day 180
      - >-
        python3.12 scripts/research/realism_check.py --events {new_dir}/raw/main
        --exchange {new_dir}/raw/simulator_exchange --assignments {new_dir}/assignments.json
        --out-json {json}

verdict:
  borderline: "띠 밖이지만 가까운 경계값의 ±20% 이내 (realism_check.judge 와 같다)"
  missing_value: fail                  # not_run · no_data 는 통과가 아니다
  mean: "5 seed 평균은 반올림하지 않고 실수 그대로 lo ≤ v ≤ hi (경계값 포함) 로 비교한다"

  required:                            # 하나라도 못 맞추면 GATE 1 불통과 — 봉인하지 않는다
    rule: "5 seed 평균이 띠 안(pass) 이고, 5 seed 각각이 pass 또는 borderline (quadrant_consistency_* 는 consistency_rule)"
    consistency_rule: "각 seed 의 절댓값 |identity_gap_bp| 이 50bp 이하 — 부호 있는 평균은 쓰지 않고 borderline 도 허용하지 않는다"
    # quadrant_consistency_*(옛 identity_*): 4분면과 τ 를 같은 arms 에서 세므로 구조적으로 항상 0 이다.
    # 잠재결과의 독립 검증이 아니라 분류 · 집계 코드 회귀 검사다. 값은 가드레일 JSON 필드 identity_gap_bp(호환 유지).
    source: guardrail_report
    checks:
      - {fact: F12, name: churn_rate,         population: active42,      band_from: guardrails.churn_rate_bp}
      # ate_T3: DR-196 확인 seed 47~51 평균 6.8%p 로 이미 띠 밖 — 실패 예상을 알고 유지한 기준(DR-208)
      - {fact: F14, name: ate_T3,             population: eligible_spec41, band_from: guardrails.ate_bp}
      - {fact: F15, name: coupon_use_T2,      population: eligible_spec41, band_from: guardrails.coupon_use_bp}
      - {fact: F15, name: coupon_use_T3,      population: eligible_spec41, band_from: guardrails.coupon_use_bp}
      - {fact: F16, name: sleeping_dog_T3,    population: eligible_spec41, band_from: guardrails.sleeping_dog_bp}
      - {fact: F16, name: persuadable_T3,     population: eligible_spec41, band_from: guardrails.persuadable_bp}
      - {fact: F16, name: quadrant_consistency_T1, population: eligible_spec41, abs_max_bp: 50}
      - {fact: F16, name: quadrant_consistency_T2, population: eligible_spec41, abs_max_bp: 50}
      - {fact: F16, name: quadrant_consistency_T3, population: eligible_spec41, abs_max_bp: 50}
      - {fact: F16, name: quadrant_consistency_T4, population: eligible_spec41, abs_max_bp: 50}

  recorded:                            # 실패해도 봉인할 수 있다 — 봉인 PR 전에 DR 에 원인·영향을 적는다
    rule: "5 seed 평균을 realism_check 판정 규칙(pass · borderline · fail)으로 판정해 리포트에 싣는다"
    source: realism
    facts: [F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, F11, F13, F17]
    on_fail: "봉인 PR 전에 실패 항목(값이 안 나온 no_data 포함)마다 DR 에 원인 Trait · 영향 · 후속 이슈를 기록한다 (data_grounding §4 의 'GATE 1 전 DR 재개' 를 이 항목들에 한해 대체 — DR-208)"

  reference_only:                      # 판정하지 않는다 — 값만 리포트에 싣는다
    - "가드레일 리포트의 role: 참고 검사 (spec41_churn_rate · active42_* — ① 의 처치 지표)"
    - "ATE · Sleeping Dog · Persuadable 의 T1 · T2 · T4"
    - "realism_check 의 F12 · F14 · F15 · F16 (1회 배정 세계라 보정 조건과 다르다)"

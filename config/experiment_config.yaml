# 실험 설정 — SRS CFG-003 · CQ-003 · PRD NFR-06 "하드코딩하지 않는다" (이슈 #206).
#
# 로더: src/decision/config.py — 스키마와 **정확히** 맞춰 읽는다. 모르는 키 · 빠진 키 · 타입 · 범위가
#       어긋나면 DecisionConfigError 로 멈춘다(조용히 기본값으로 떨어지지 않는다).
# 읽는 곳: src/orchestration/run_sprint.py (실행 기본값 · 탐색 RCT) · src/decision/ab_test.py (α · 검정력 · SRM).
#
# ★ 처음(#206)에는 코드 상수 · CLI 기본값을 동작이 바뀌지 않게 그대로 옮겼다. 그 뒤 결정으로 바꾼 것:
#   - rct.active_days 삭제 — #234 · DR-234
#   - run.num_customers 20,000 → 50,000 · run.warmup_days 312 신설 — #211 · DR-211(규모는 DR-234)
#   tests/test_decision_config.py 가 지금 값을 고정한다. 바꾸는 것은 결정이므로 DR 을 쓰고
#   테스트의 기준값을 함께 고친다.
# ★ 실험 결과(Qini · Incremental Profit)를 보고 배정 비율 · α 를 고치지 않는다.
#
# warmup 은 run.profile 의 값만 여기 있다(#211). 다른 프로파일의 권장 warmup 표는 아직 코드
# (run_sprint.PROFILE_WARMUP_DAYS · data_spec §2.2)에 있다. 그 표와 label window · S1 eligible · C_rule 추정을
# 옮기지 않은 이유는 docs/decisions/DR-206-main-cli-config.md "남은 불확실성".

schema_version: 1

# 실행 기본값 — `python src/main.py` · `python -m src.orchestration.run_sprint` 가 인자 없이 쓰는 값.
# 실험 규모는 DR-234(규모 A · FR-05 · FR-03)이고 #211 이 여기에 넣었다(DR-211):
#   고객 50,000명 · t1 = Day 312 · 총 396일(warmup 312 + RCT 42 + 분기 42) = 2025-01-01~2026-01-31, 13개월.
#   control_share 0.5 에서 Eligible 비율 r ≈ 0.45 이면 T0 · T1~T4 합이 각 ≈ 1.1만 명이다.
# 스모크는 --customers 2000 --profile small (warmup 은 그 프로파일 권장값 180일).
run:
  num_customers: 50000
  profile: reference     # 시뮬레이터 프로파일 이름
  # warmup(= t1 일수). **위 profile 로 돌 때만** 쓴다 — --profile 을 다른 값으로 주면 그 프로파일의
  # 권장값(data_spec §2.2, run_sprint.PROFILE_WARMUP_DAYS)이고, --warmup-days 를 주면 그 값이다.
  warmup_days: 312

holdout:
  # 개발 seed — 탐색 RCT 배정(random.Random) · CV fold · uplift 분할 · 모델 random_state 가 모두 이 seed 다.
  # Final Holdout(GATE 4) seed 는 아직 없다 — 모델 저장(#184 잔여)과 함께 정한다. 두 seed 는 달라야 한다.
  development_seed: 42

# 탐색 RCT — t1 의 Eligible 고객을 T0~T4 로 무작위 배정한다.
# 모집단은 설정값이 아니라 정본 정의다 — data_spec §4.1 Eligible(#194 · #164 공유), run_sprint.ELIGIBLE_*.
# 예전의 active_days(t1 직전 90일 활동 고객)는 #234 에서 없앴다 — docs/decisions/DR-234-population-experiment-scale.md.
rct:
  control_share: 0.5     # T0 비율. 나머지를 T1~T4 에 균등(각 12.5%)

# 가상 A/B 분석 (SRS AB-001~005 · CFG-003 ab_test).
ab_test:
  alpha: 0.05            # 양측 유의수준
  target_power: 0.8      # 최소 표본 계산의 목표 검정력
  srm_p_threshold: 0.001 # SRM 카이제곱 p 가 이보다 작으면 배정 비율 불일치로 판정

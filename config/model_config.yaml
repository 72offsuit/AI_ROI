# 의사결정 모델 설정 — SRS CFG-002 · CQ-003 · PRD NFR-06 "하드코딩하지 않는다" (이슈 #206).
#
# 로더: src/decision/config.py — 스키마와 **정확히** 맞춰 읽는다. 모르는 키 · 빠진 키 · 타입 · 범위가
#       어긋나면 DecisionConfigError 로 멈춘다(조용히 기본값으로 떨어지지 않는다).
# 값은 이 파일 한 곳에만 있다. 코드(churn.py · clv.py · segments.py)는 이 값을 읽어 이름만 붙인다.
#
# ★ 아래 값은 #206 이전 코드 상수와 **같다** — 동작이 바뀌지 않게 옮기기만 했다.
#   tests/test_decision_config.py 가 그 동일성을 고정한다. 값을 바꾸면 그 테스트가 실패한다:
#   바꾸는 것은 결정이므로 DR(docs/decisions/)을 쓰고 테스트의 기준값을 함께 고친다.
# ★ Test · Final Holdout 을 보며 이 값을 고치지 않는다 (src/decision/AGENTS.md). 튜닝은 Validation 에서.
#
# 아직 옮기지 않은 것과 그 이유는 docs/decisions/DR-206-main-cli-config.md "남은 불확실성".

schema_version: 1

churn:
  # #179: Test 위험도 기준선의 사전 고정 사양. Train 내부·Test 점수로 선택하지 않는다.
  risk_baseline_model: logistic_regression
  # Stratified K-Fold — 4 모델(baseline 2 · 제안 2)을 같은 fold 로 평가한다 (SRS ML-003).
  # 소수 클래스가 이보다 적으면 그 수로 줄인다(churn.fold_indices).
  cv_folds: 5
  # F1 임계를 정하는 학습 fold 내부 OOF fold 수 — 검증 fold 를 보지 않고 임계를 정한다.
  threshold_inner_folds: 3
  # SHAP(TreeExplainer) 계산 표본 상한.
  shap_sample: 500
  # 추정기 하이퍼파라미터. random_state 는 실행 seed 에서 온다(여기 두지 않는다).
  # rule_recency 는 학습 데이터에서 임계를 정하는 규칙이라 하이퍼파라미터가 없다.
  models:
    logistic_regression:
      C: 0.5
      max_iter: 2000
      class_weight: balanced
    random_forest:
      n_estimators: 300
      min_samples_leaf: 3
      class_weight: balanced_subsample
      n_jobs: -1
    hist_gb:
      learning_rate: 0.05
      max_iter: 300
      max_leaf_nodes: 15
      l2_regularization: 1.0
      class_weight: balanced
      early_stopping: false
    # #215 · SRS FR-14 — 기본값은 hist_gb 와 같은 크기(학습률 0.05 · 300 회 · 잎 15 안팎)로 맞춰 비교를 공정하게 둔다.
    # XGBoost 는 class_weight 가 없다 — 학습 모집단(T0 군)의 이탈 비율이 50% 안팎이라 가중 없이 둔다(DR-215).
    xgboost:
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 4
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0
      tree_method: hist
      n_jobs: 1
    # deterministic · force_row_wise — 같은 seed 면 같은 나무가 나오게 한다(NFR-01). verbose -1 은 로그 끔.
    # n_jobs 1 — 수만 행 규모에서는 단일 스레드가 더 빠르다. -1 이면 sklearn · OpenMP 스레드와 겹쳐 느려진다(#215 실측).
    lightgbm:
      n_estimators: 300
      learning_rate: 0.05
      num_leaves: 15
      min_child_samples: 20
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_lambda: 1.0
      class_weight: balanced
      deterministic: true
      force_row_wise: true
      n_jobs: 1
      verbose: -1
  # #215 — Validation 튜닝(Grid). 축마다 후보를 적고, 그 곱의 조합을 **검증 데이터로만** 비교한다:
  # 앞 기준일(t1 − 42일)로 학습 → t1 학습 모집단으로 평가(시간 순서 검증). 그 데이터가 없으면 학습 데이터
  # 내부 교차검증. 시험 · 홀드아웃은 보지 않는다. 각 축은 위 기본값을 포함한다 — 검증 기준으로 기본보다
  # 나빠지지 않게. 고른 값은 churn_eval.models[].tuning 에 격자 전체 점수와 함께 남는다.
  tuning:
    enabled: true
    metric: roc_auc
    grids:
      random_forest:
        min_samples_leaf: [1, 3, 10]
        n_estimators: [300]
      hist_gb:
        learning_rate: [0.03, 0.05, 0.1]
        max_leaf_nodes: [15, 31]
      xgboost:
        max_depth: [3, 4, 6]
        learning_rate: [0.05, 0.1]
      lightgbm:
        num_leaves: [15, 31]
        learning_rate: [0.05, 0.1]

clv:
  # evaluate_clv 의 KFold OOF fold 수.
  cv_folds: 5
  # fit_clv 의 HistGradientBoostingRegressor. poisson 손실 — 0 이 많고 꼬리가 긴 비음수 매출(clv.py 독스트링).
  hist_gb:
    loss: poisson
    learning_rate: 0.05
    max_iter: 200
    max_leaf_nodes: 15
    l2_regularization: 1.0
    min_samples_leaf: 20
    early_stopping: false
  # #217 2부 — 12개월 CLV(BG/NBD + Gamma-Gamma, src/decision/clv_lifetime.py). 결과는 할인 **매출** 현재가치이고
  # 이익은 전략이 margin_rate 를 곱한다(DR-217). 할인율은 연 실효율 · 월말 현금흐름(#203 광진 조사 P3 식).
  lifetime:
    horizon_months: 12            # SRS CLV-002
    annual_discount_rate: 0.12    # Gupta & Lehmann (2003) 사례값 — #203 문헌 가정 10~16% 의 가운데(업계 표준 아님)
    discount_sensitivity: [0.8, 1.2]   # 할인율 ±20% (이슈 #217)
    high_value_share: 0.2         # SRS CLV-003 상위 20%

# 세그먼트 · 4분면 경계 — 분위수(데이터 단위에 무관). segments.assign_segments · assign_quadrants.
segmentation:
  clv_high_q: 0.8      # CLV 상위 20% = 고가치 (SRS AT-CLV-01 Top20% 와 같은 경계)
  churn_high_q: 0.5    # 이탈 확률 중앙값 이상 = 고위험
  uplift_band_q: 0.6   # |uplift| 분포의 60% 분위수 = '≈0' 띠의 반폭. 그보다 크면 양/음

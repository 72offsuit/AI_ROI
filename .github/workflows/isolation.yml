name: Tests

# 시뮬레이터(정답 생성)와 의사결정 시스템(정답 추론)의 경계를 검사한다.
# 근거: PRD §21.1, SRS ISO-001~006, docs/data_spec.html §17
#
# Plan 서브모듈은 체크아웃하지 않는다.
#  - 검사 대상이 src/ 와 tests/ 뿐이라 필요가 없고,
#  - Plan 이 private 이라 기본 토큰으로는 받을 수 없다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    name: 격리 경계 + 전체 테스트
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      # 의존성 설치 단계가 없다. tests/test_isolation.py 는 표준 라이브러리
      # (ast · pathlib · unittest)만 사용하므로 설치할 것이 없다 — ISO-005.
      - name: Run isolation checks
        run: python -m unittest tests.test_isolation -v

      - name: Run all tests
        run: python -m unittest discover -s tests -t . -v

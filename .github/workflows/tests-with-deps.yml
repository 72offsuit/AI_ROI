name: Tests (with deps)

# Runs the same suite as isolation.yml, but WITH the pinned dependencies installed.
#
# Why a separate file instead of an install step in isolation.yml:
#   isolation.yml deliberately has no install step. That absence is the proof of
#   ISO-005 -- "every test passes with none of the dependencies present". Adding
#   `pip install` there would delete the guarantee rather than extend it, because a
#   green run would no longer tell us whether the suite still works bare.
#   Keeping both means the DIFFERENCE between the two skip counts is itself the
#   answer to "which checks actually need a dependency". See ADR-0004.
#
# Decision D-19 -- approved by the user 2026-09-11. Created outside the W5 roles
# because .github/workflows/** is `sealed` in
# .agent-team/04-architecture/tools/ownership.json.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-with-deps:
    name: 의존성 설치 후 전체 테스트
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Plan/ is a private submodule and the suite does not read it.
          # Same reasoning as isolation.yml.
          submodules: false
          # Full history so the team boundary check can diff `origin/main...HEAD`.
          # With the default depth of 1 a PR run has no main ref and that check was
          # BLOCKED on every PR, never compared (#241). Approved by the user 2026-10-25.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          # Must match isolation.yml. requirements.txt pins were resolved on 3.12.4;
          # a release shipping only cp314 wheels would break this job silently.
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Report the installed versions so a failing run can be told apart from a
      # resolution drift without re-running locally.
      - name: Show resolved versions
        run: python -m pip freeze

      - name: Run all tests
        run: python -m unittest discover -s tests -t . -v

      # The skip count is the payload of this job. isolation.yml skips the checks that
      # need a dependency; this one should skip far fewer.
      #
      # ★ Reporting the number was not enough (review finding M9, issue #59): a rising
      #   count only meant something if a human read the log, so a check could stop
      #   running while the job stayed green. The gate below compares instead of prints.
      #
      #   It does NOT assert a threshold. A hardcoded maximum goes stale the first time
      #   someone legitimately adds or removes a skip, and a stale declaration nobody
      #   updates is the exact defect this issue closes. The assertion is semantic:
      #   once the dependencies are installed, NO test may still be skipped for a
      #   missing dependency. That never goes stale, and it catches what actually
      #   goes wrong -- an install step that failed quietly, or a new dependency
      #   added to the code but not to requirements.
      - name: Report skip count
        if: always()
        run: |
          python -m unittest discover -s tests -t . 2>&1 | tail -3

      - name: Gate — no dependency-blocked skips remain
        if: always()
        run: |
          python -m unittest discover -s tests -t . -v 2>&1 \
            | grep -oE "skipped '[^']*'" > /tmp/skips.txt || true
          echo "--- 이 잡의 skip 사유 전체 ---"
          sort /tmp/skips.txt | uniq -c | sort -rn || true
          if grep -q "미설치" /tmp/skips.txt; then
            echo
            echo "::error::의존성을 설치했는데도 '미설치' 사유로 건너뛴 검사가 있다."
            echo "설치 단계가 조용히 실패했거나, 코드가 requirements 에 없는 의존성을 쓴다."
            echo "건너뛴 검사는 통과가 아니다 — 아래 항목을 확인하라:"
            grep "미설치" /tmp/skips.txt | sort -u
            exit 1
          fi
          echo
          echo "OK — 의존성 사유로 건너뛴 검사 0건."
